name: 7/24 Borsa Paper Trading Bot Cron

on:
  schedule:
    # Runs Monday to Friday every 2 minutes during BIST market hours (07:00-15:00 UTC = 10:00-18:00 TRT)
    - cron: '*/2 7-15 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  run-paper-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Paper Bot Market Scanner & Trade Execution
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://qapgyjnhgywszwdfegam.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_vXj3Ad7pWMoW5t-PaoR8Iw_Z1Z6eRUt' }}
        run: node scripts/run_paper_bot_cron.js
